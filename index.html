<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sistemi DDD Ekologjia</title>

    <!-- iPhone Optimization & App Icon -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/r1TRxoo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ekologjia DDD">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }

        input,
        select,
        textarea {
            font-size: 16px !important;
        }

        .doc-line {
            border-bottom: 1px solid #000;
            display: inline-block;
            padding: 0 4px;
            min-height: 1.2em;
        }

        .checkbox-box {
            width: 14px;
            height: 14px;
            border: 1px solid black;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        #pdf-export-container {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 10mm;
            position: relative;
            color: black;
        }

        @media print {
            .no-print {
                display: none !important;
            }
        }

        @media (display-mode: standalone) {

            #edit-header,
            #clients-header {
                padding-top: env(safe-area-inset-top, 0px);
                padding-top: constant(safe-area-inset-top, 0px);
            }

            #edit-header button,
            #clients-header button {
                padding-top: 8px !important;
                padding-bottom: 8px !important;
                padding-left: 12px !important;
                padding-right: 12px !important;
                font-size: 13px !important;
                line-height: 1.1 !important;
            }

            #edit-header i,
            #clients-header i {
                font-size: 14px !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div id="app">
        <!-- LOGIN VIEW -->
        <div id="login-view" class="hidden min-h-screen flex items-center justify-center p-6 bg-white">
            <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                <div class="p-8">
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-black text-gray-900 italic tracking-tighter mb-2">EKOLOGJIA <span
                                class="text-green-600">DDD</span></h1>
                        <p class="text-gray-500 font-bold uppercase tracking-wide text-sm">Identifikimi</p>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Email</label>
                            <input type="email" id="login-email"
                                class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none focus:border-green-500 transition-colors text-gray-900"
                                placeholder="admin@example.com">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">Fjalëkalimi</label>
                            <input type="password" id="login-password"
                                class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none focus:border-green-500 transition-colors text-gray-900"
                                placeholder="••••••••">
                        </div>
                        <div id="login-error" class="text-center text-red-500 font-bold text-sm min-h-[20px]"></div>
                        <button id="login-btn"
                            class="w-full bg-green-600 hover:bg-green-700 text-white p-4 rounded-xl font-black uppercase tracking-widest shadow-lg transition-all active:scale-95">
                            Hyr
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="min-h-screen flex flex-col items-center justify-center p-6 pb-20">
            <div class="w-full flex justify-end px-6 absolute top-6">
                <button onclick="doLogout()"
                    class="text-gray-400 hover:text-red-500 font-bold text-xs uppercase tracking-widest flex items-center gap-2 transition-colors">
                    <i class="fas fa-sign-out-alt"></i> Dil
                </button>
            </div>
            <div class="mb-10 text-center mt-10">
                <h1 class="text-4xl font-black text-gray-900 italic tracking-tighter mb-2">EKOLOGJIA <span
                        class="text-green-600">SHPK</span></h1>
                <p class="text-gray-500 font-medium text-lg">Paneli i Kontrollit</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
                <button onclick="createNew()"
                    class="group bg-gradient-to-br from-green-600 to-green-700 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-4 border-b-4 border-green-900">
                    <div
                        class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-2 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-plus text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black uppercase tracking-wide">Shto Vërtetim</span>
                </button>

                <button onclick="showClientManagement()" id="btn-manage-clients"
                    class="group bg-gradient-to-br from-green-700 to-green-800 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-4 border-b-4 border-green-950">
                    <div
                        class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-2 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-users-cog text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black uppercase tracking-wide">Menaxho Klientët</span>
                </button>

                <button onclick="showClientForm()" id="btn-user-add-client"
                    class="group bg-gradient-to-br from-blue-600 to-blue-700 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-4 border-b-4 border-blue-900">
                    <div
                        class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-2 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-user-plus text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black uppercase tracking-wide">Shto Klient të Ri</span>
                </button>

                <button onclick="showPanicList()" id="dash-panic-btn"
                    class="group bg-gradient-to-br from-red-600 to-red-700 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-4 border-b-4 border-red-900 relative overflow-hidden">
                    <div
                        class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-2 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-exclamation-triangle text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black uppercase tracking-wide">Ri-Intervenim</span>
                    <span id="dash-expired-count"
                        class="absolute top-6 right-6 bg-white text-red-700 font-black px-3 py-1 rounded-full text-sm shadow-lg">0</span>
                </button>

                <button onclick="showList()"
                    class="group bg-gradient-to-br from-gray-800 to-gray-900 text-white p-8 rounded-3xl shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-4 border-b-4 border-black">
                    <div
                        class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-2 group-hover:bg-white/30 transition-colors">
                        <i class="fas fa-folder-open text-4xl"></i>
                    </div>
                    <span class="text-2xl font-black uppercase tracking-wide">Vërtetimet e Lëshuara</span>
                </button>
            </div>
            <div class="mt-12 text-[9px] text-[#a0a0a0] font-bold uppercase tracking-widest pb-4">
                © 2026 Zhvilluar nga Visar F.
            </div>
        </div>

        <!-- LIST VIEW -->
        <div id="list-view" class="hidden max-w-5xl mx-auto py-10 px-4">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button onclick="showDashboard()"
                        class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-black uppercase tracking-wide transition-all shadow-lg flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i> Kthehu në Menu
                    </button>
                </div>
                <div id="panic-area" class="w-full md:w-auto flex justify-end">
                    <button onclick="togglePanicFilter()" id="btn-panic"
                        class="w-full md:w-auto bg-white hover:bg-gray-50 text-green-700 border-2 border-green-600 px-6 py-2 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-sm text-sm">
                        <i class="fas fa-filter"></i> Filtro: Të gjitha
                    </button>
                </div>
            </div>

            <input type="text" id="search-input" oninput="renderList()"
                class="w-full p-5 bg-white border-2 rounded-2xl font-bold text-xl shadow-lg mb-8 outline-none focus:border-green-500"
                placeholder="Kërko klientin...">
            <div class="overflow-x-auto bg-white rounded-2xl shadow-xl border border-gray-100">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-white text-[10px] uppercase tracking-wider">
                            <th class="p-4 font-black">Nr. Vërtetimit</th>
                            <th class="p-4 font-black">Klienti</th>
                            <th class="p-4 font-black">Data</th>
                            <th class="p-4 font-black">Çmimi</th>
                            <th class="p-4 font-black">Lëshuar nga</th>
                            <th class="p-4 font-black text-center">Veprimet</th>
                        </tr>
                    </thead>
                    <tbody id="docs-list"></tbody>
                </table>
            </div>
        </div>

        <!-- Placeholder for other views to be added by script -->
        <div id="dynamic-views">
            <!-- FAQJA E EDITIMIT -->
            <div id="edit-view" class="hidden bg-white min-h-screen">
                <div id="edit-header"
                    class="border-b sticky top-0 bg-white/90 backdrop-blur-md z-10 px-4 py-4 shadow-sm">
                    <div class="max-w-5xl mx-auto flex justify-between items-center">
                        <button onclick="showList()"
                            class="text-green-600 font-black flex items-center gap-2 hover:text-green-800 transition-colors uppercase tracking-tight">
                            <i class="fas fa-arrow-left"></i> Anulo
                        </button>
                        <div class="text-center hidden md:block">
                            <span class="font-black text-lg uppercase text-black">Modifikimi i Dokumentit</span>
                        </div>
                        <button onclick="saveData()"
                            class="bg-green-600 hover:bg-green-700 text-white px-8 md:px-12 py-3 rounded-xl font-black shadow-md transition-all flex items-center justify-center uppercase tracking-wide">
                            <i class="fas fa-save mr-2"></i> RUAJ DHE DËRGO NË E-MAIL
                        </button>
                    </div>
                </div>

                <div class="max-w-5xl mx-auto p-6 space-y-8 pb-20">
                    <div
                        class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-green-50 p-6 rounded-2xl border border-green-100">
                        <div>
                            <label
                                class="block text-[10px] font-black text-green-600 uppercase mb-2 tracking-widest">Data</label>
                            <input type="date" id="f-data"
                                class="w-full p-3 bg-white border-2 border-green-200 rounded-xl font-bold outline-none">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-green-600 uppercase mb-2 tracking-widest">Ora</label>
                            <input type="time" id="f-ora"
                                class="w-full p-3 bg-white border-2 border-green-200 rounded-xl font-bold outline-none">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-green-600 uppercase mb-2 tracking-widest">Nr.
                                i Vërtetimit</label>
                            <div class="flex gap-2">
                                <input type="text" id="f-nr-v"
                                    class="w-full p-3 bg-white border-2 border-green-200 rounded-xl font-bold outline-none"
                                    placeholder="Nr. 000/26">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <label
                            class="block text-[10px] font-black text-gray-400 uppercase tracking-widest border-b pb-2">Informacionet
                            e Klientit</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2 relative">
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">Emri i Klientit /
                                    Subjekti</label>
                                <input type="text" id="f-klienti" autocomplete="off"
                                    class="w-full p-4 bg-green-50 border-2 border-green-100 rounded-xl font-black uppercase outline-none focus:border-green-600 transition-all text-black"
                                    placeholder="Kërko klientin..." oninput="handleFuzzySearch(this.value)">
                                <div id="fuzzy-results"
                                    class="hidden absolute left-0 right-0 top-full mt-2 bg-white border-2 border-green-500 rounded-2xl shadow-2xl z-50 max-h-80 overflow-y-auto">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">Adresa</label>
                                <input type="text" id="f-adresa"
                                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold uppercase">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">NUI</label>
                                <input type="text" id="f-nui"
                                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold uppercase">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">E-mail i Klientit</label>
                                <input type="email" id="f-email"
                                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold uppercase"
                                    placeholder="klienti@email.com">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">m²</label>
                                <input type="text" id="f-m2"
                                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 mb-1">Tel</label>
                                <input type="text" id="f-tel"
                                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-4">
                        <div><label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest border-b pb-2">Shërbimet</label>
                            <div class="grid grid-cols-2 gap-2" id="sh-inputs"></div>
                        </div>
                        <div><label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest border-b pb-2">Pestat</label>
                            <div class="grid grid-cols-2 gap-2" id="pest-inputs"></div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase tracking-widest">Preparatet</label>
                            <button onclick="addNewPrepField()"
                                class="text-blue-600 text-[10px] font-black uppercase hover:underline">+ Shto
                                manual</button>
                        </div>
                        <div id="prep-inputs" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"></div>
                        <div id="custom-prep-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    </div>

                    <div class="pt-6 border-t border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest">Metoda
                                e Aplikimit</label>
                            <div class="flex flex-wrap gap-3" id="metoda-inputs"></div>
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest">Shënime</label>
                            <textarea id="f-shenime"
                                class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl h-24 font-medium text-sm"></textarea>
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest text-[#78b72a]">Çmimi
                                i Shërbimit (€)</label>
                            <input type="text" id="f-cmimi"
                                class="w-full p-3 bg-yellow-50 border border-yellow-200 rounded-xl font-bold text-gray-700">
                        </div>
                    </div>

                    <div class="md:col-span-2 mt-8 pt-8 border-t border-gray-100">
                        <div class="mb-6">
                            <label
                                class="block text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">EMRI I
                                TEKNIKUT</label>
                            <input type="text" id="f-tekniku-emri"
                                class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label
                                    class="block text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">NËNSHKRIMI
                                    I TEKNIKUT</label>
                                <div
                                    class="rounded-xl bg-gray-50 h-40 relative border-2 border-dashed border-green-400">
                                    <canvas id="sig-tekniku" class="w-full h-full"></canvas>
                                </div>
                                <button onclick="clearSig('tekniku')"
                                    class="text-[10px] text-green-600 font-medium mt-2">Pastro</button>
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-black text-gray-400 uppercase mb-2 tracking-widest">NËNSHKRIMI
                                    I KLIENTIT</label>
                                <div
                                    class="rounded-xl bg-gray-50 h-40 relative border-2 border-dashed border-green-400">
                                    <canvas id="sig-klienti" class="w-full h-full"></canvas>
                                </div>
                                <button onclick="clearSig('klienti')"
                                    class="text-[10px] text-green-600 font-medium mt-2">Pastro</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FAQJA MENAXHO KLIENTËT -->
            <div id="clients-mgmt-view" class="hidden bg-white min-h-screen">
                <div id="clients-header"
                    class="border-b sticky top-0 bg-white/90 backdrop-blur-md z-10 px-4 py-4 shadow-sm">
                    <div class="max-w-5xl mx-auto flex justify-between items-center">
                        <button onclick="showDashboard()"
                            class="text-gray-500 font-bold flex items-center gap-2 transition-colors"><i
                                class="fas fa-arrow-left"></i> Kthehu</button>
                        <span class="font-black text-lg uppercase">Menaxho Klientët</span>
                        <button onclick="showClientForm()"
                            class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md">Shto
                            Klient</button>
                    </div>
                </div>
                <div class="max-w-5xl mx-auto p-6">
                    <div id="clients-table-container" class="grid grid-cols-1 gap-4"></div>
                </div>
            </div>

            <!-- FAQJA E SHTIMIT TË KLIENTIT -->
            <div id="client-view" class="hidden bg-white min-h-screen">
                <div class="border-b sticky top-0 bg-white/90 backdrop-blur-md z-10 px-4 py-4 shadow-sm">
                    <div class="max-w-xl mx-auto flex justify-between items-center">
                        <button id="btn-client-form-back" onclick="showClientManagement()"
                            class="text-gray-500 font-bold flex items-center gap-2"><i class="fas fa-arrow-left"></i>
                            Kthehu</button>
                        <button onclick="handleSaveClient()"
                            class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md uppercase tracking-widest font-black">RUAJ</button>
                    </div>
                </div>
                <div class="max-w-xl mx-auto p-6 space-y-6">
                    <input type="text" id="c-klienti"
                        class="w-full p-3 bg-gray-50 border rounded-xl font-bold uppercase"
                        placeholder="EMRI I KLIENTIT">
                    <input type="text" id="c-nui" class="w-full p-3 bg-gray-50 border rounded-xl font-bold uppercase"
                        placeholder="NUI">
                    <input type="text" id="c-adresa" class="w-full p-3 bg-gray-50 border rounded-xl font-bold uppercase"
                        placeholder="ADRESA">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="c-m2" class="w-full p-3 bg-gray-50 border rounded-xl font-bold"
                            placeholder="m²">
                        <input type="text" id="c-tel" class="w-full p-3 bg-gray-50 border rounded-xl font-bold"
                            placeholder="TEL">
                    </div>
                    <input type="email" id="c-email" class="w-full p-3 bg-gray-50 border rounded-xl font-bold uppercase"
                        placeholder="E-MAIL I KLIENTIT">
                </div>
            </div>

            <!-- FAQJA E PRINTIMIT -->
            <div id="print-view" class="hidden fixed inset-0 bg-zinc-900 overflow-auto p-4 z-50">
                <div class="max-w-[21cm] mx-auto flex justify-between mb-4 sticky top-0 z-10">
                    <button onclick="showList()"
                        class="bg-white/10 text-white px-6 py-2 rounded-lg font-bold">Mbyll</button>
                    <button id="btn-download-pdf"
                        class="bg-green-600 text-white px-10 py-2 rounded-lg font-bold shadow-xl border-b-4 border-green-800 active:translate-y-1">Shkarko
                        PDF</button>
                </div>
                <div id="print-content" class="bg-white w-[21cm] min-h-[29.7cm] mx-auto shadow-2xl"></div>
            </div>
        </div>
    </div>

    <!-- SCRIPT START -->
    <div id="pdf-render-zone"
        style="position: absolute; left: -9999px; top: -9999px; width: 800px; background: white; pointer-events: none;">
    </div>
    <script>
        const SH_TYPES = ["KONTROLLË", "INTERVENIM", "DEZINFEKTIM", "DEZINSEKTIM", "DERATIZIM"];
        const PEST_TYPES = ["BAKTERE / VIRUS", "MUSHKONJA", "MIZA", "MINJËT", "GJARPËRINJ", "BUBURRECA", "SILVER FISH", "GREJZA", "ÇIMKA", "PLESHTA", "FURRËTARE"];
        const METODA_TYPES = ["E LËNGSHME", "E NGURTË", "GRANULA"];
        const UNIT_TYPES = ["LITËR", "ML", "GRAM", "KILOGRAM", "COPË", "KUTIA", "NGJITËS"];
        const FIXED_PREPS = ["DIDECILDIMETHYLAMMONIUM CHLORIDE", "FIPRONIL", "PERMETHRINE", "BRODIFACOUM", "BROMADIOLONE", "CINNAMON OIL"];
        const DEFAULT_NOTE = "Shërbimi u krye sipas standardeve dhe protokolleve ekologjike të kërkuara për trajtimin e hapësirave.";
        const FIXED_LOGO_URL = 'https://i.imgur.com/XcrU0AI.png';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: 'AIzaSyC8LTR7VlCNey0hH8j8jJfgW_IYj7YTABY',
            authDomain: 'vertetimi-eb5b6.firebaseapp.com',
            projectId: 'vertetimi-eb5b6',
            storageBucket: 'vertetimi-eb5b6.firebasestorage.app',
            messagingSenderId: '130594879757',
            appId: '1:130594879757:web:4f061f88f42aa092af5844',
            measurementId: 'G-9PD6LLBV5K'
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();

        // Enable Offline Persistence
        firestore.enablePersistence().catch((err) => {
            console.warn('Persistence error:', err.code);
        });

        let db = [];
        let clientsDb = [];
        let currentId = null;
        let editingClientNui = null;
        let showOnlyExpired = false;
        let padTekniku, padKlienti;

        // Auth State
        let currentUser = null;
        let currentRole = "user";

        // --- AUTH & GATING ---
        function showLogin() {
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view', 'login-view'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            document.getElementById('login-view').classList.remove('hidden');
        }

        function doLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = "Ju lutem plotësoni të gjitha fushat.";
                return;
            }

            errorEl.textContent = "";
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(() => {
                    // Auth state listener will handle redirect
                    btn.disabled = false;
                    btn.innerHTML = 'HYR';
                })
                .catch((error) => {
                    console.error(error);
                    btn.disabled = false;
                    btn.innerHTML = 'HYR';
                    errorEl.textContent = "Gabim: " + error.message;
                });
        }

        function doLogout() {
            firebase.auth().signOut().then(() => {
                showLogin();
            });
        }

        // --- FIREBASE SYNC ---
        function initRealtimeListeners() {
            // Certificates
            firestore.collection('vertetimet').orderBy('id', 'desc').onSnapshot((snapshot) => {
                db = [];
                snapshot.forEach((doc) => db.push(doc.data()));
                if (currentUser) { // Only render if logged in
                    renderList();
                    updateDashboardCount();
                    updateClientDatalist();
                }
            });

            // Clients
            firestore.collection('klientet').onSnapshot((snapshot) => {
                clientsDb = [];
                snapshot.forEach((doc) => clientsDb.push(doc.data()));
                updateClientDatalist();
                if (!document.getElementById('clients-mgmt-view').classList.contains('hidden')) {
                    renderClientsTable();
                }
            });
        }

        // --- CORE LOGIC ---
        function getNextCertNumber() {
            const viti = new Date().getFullYear().toString().slice(-2); // "26"
            let maxSequence = 0;
            db.forEach(d => {
                if (d.nr_v && d.nr_v.includes('/' + viti)) {
                    // Match "Nr. XXX/26" or just "XXX/26"
                    const parts = d.nr_v.match(/(\d+)\//);
                    if (parts && parts[1]) {
                        const seq = parseInt(parts[1]);
                        if (seq > maxSequence) maxSequence = seq;
                    }
                }
            });
            const nextSeq = String(maxSequence + 1).padStart(3, '0');
            return `Nr. ${nextSeq}/${viti}`;
        }

        function enableManualNrEdit() {
            // Deprecated - field is now always editable
        }

        function monthsDiff(dateStr) {
            if (!dateStr) return 0;
            const d1 = new Date(dateStr);
            const d2 = new Date();
            let months = (d2.getFullYear() - d1.getFullYear()) * 12;
            months -= d1.getMonth();
            months += d2.getMonth();
            if (d2.getDate() < d1.getDate()) months--;
            return months < 0 ? 0 : months;
        }

        function initPads() {
            const canvasTekniku = document.getElementById('sig-tekniku');
            const canvasKlienti = document.getElementById('sig-klienti');

            const _resize = (c, pad) => {
                if (!c || !c.offsetWidth || !pad) return;
                let data = pad.toDataURL();
                if (!data || data === "data:,") data = c.dataset.latest;
                const r = Math.max(window.devicePixelRatio || 1, 1);
                c.width = c.offsetWidth * r;
                c.height = c.offsetHeight * r;
                c.getContext("2d").scale(r, r);
                if (data && data !== "data:,") pad.fromDataURL(data);
            };

            if (!padTekniku) {
                padTekniku = new SignaturePad(canvasTekniku, { backgroundColor: 'rgba(255, 255, 255, 0)', penColor: '#0000FF', minWidth: 2.5, maxWidth: 2.5 });
                padTekniku.onEnd = () => { canvasTekniku.dataset.latest = padTekniku.toDataURL(); };
                window.addEventListener("resize", () => _resize(canvasTekniku, padTekniku));
            }
            if (!padKlienti) {
                padKlienti = new SignaturePad(canvasKlienti, { backgroundColor: 'rgba(255, 255, 255, 0)', penColor: '#0000FF', minWidth: 2.5, maxWidth: 2.5 });
                padKlienti.onEnd = () => { canvasKlienti.dataset.latest = padKlienti.toDataURL(); };
                window.addEventListener("resize", () => _resize(canvasKlienti, padKlienti));
            }

            _resize(canvasTekniku, padTekniku);
            _resize(canvasKlienti, padKlienti);
        }

        function clearSig(type) {
            if (type === 'tekniku') { padTekniku.clear(); delete document.getElementById('sig-tekniku').dataset.latest; }
            else { padKlienti.clear(); delete document.getElementById('sig-klienti').dataset.latest; }
        }

        function buildForms() {
            document.getElementById('sh-inputs').innerHTML = SH_TYPES.map(s => `
                <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" class="sh-check w-4 h-4 accent-green-600" value="${s}">
                    <span class="text-[9px] font-bold uppercase">${s}</span>
                </label>`).join('');
            document.getElementById('pest-inputs').innerHTML = PEST_TYPES.map(p => `
                <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
                    <input type="checkbox" class="pest-check w-4 h-4 accent-green-600" value="${p}">
                    <span class="text-[9px] font-bold uppercase">${p}</span>
                </label>`).join('');
            document.getElementById('metoda-inputs').innerHTML = METODA_TYPES.map(m => `
                <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-green-50 bg-gray-50">
                    <input type="checkbox" class="metoda-check w-5 h-5 accent-green-600" value="${m}">
                    <span class="text-[11px] font-black uppercase">${m}</span>
                </label>`).join('');
            document.getElementById('prep-inputs').innerHTML = FIXED_PREPS.map(p => {
                const sid = p.replace(/\s/g, '_');
                return `<div class="p-3 border rounded-xl bg-gray-50/50">
                    <label class="flex items-center gap-2 mb-2 cursor-pointer">
                        <input type="checkbox" class="prep-check w-4 h-4 accent-green-600" data-name="${p}" onchange="togglePrepRow('${sid}', this.checked)">
                        <span class="text-[9px] font-black uppercase">${p}</span>
                    </label>
                    <div id="qty-row-${sid}" class="hidden gap-2">
                        <input type="text" placeholder="Sasia" class="prep-qty p-1.5 text-xs border rounded w-20 font-bold">
                        <select class="prep-unit p-1.5 text-[10px] border rounded bg-white font-bold flex-1">${UNIT_TYPES.map(u => `<option value="${u}">${u}</option>`).join('')}</select>
                    </div>
                </div>`;
            }).join('');
        }

        function togglePrepRow(sid, show) {
            const row = document.getElementById(`qty-row-${sid}`);
            if (row) row.style.display = show ? 'flex' : 'none';
        }

        function addNewPrepField(name = "", qty = "", unit = "LITËR") {
            const container = document.getElementById('custom-prep-container');
            const div = document.createElement('div');
            div.className = "p-3 border-2 border-dashed border-blue-100 rounded-xl bg-blue-50/20";
            div.innerHTML = `
                <input type="text" class="custom-prep-name w-full p-2 text-[10px] border rounded mb-2 font-black uppercase" placeholder="EMRI I PREPARATIT" value="${name}">
                <div class="flex gap-2">
                    <input type="text" class="custom-prep-qty p-2 text-xs border rounded w-20 font-bold" placeholder="SASIA" value="${qty}">
                    <select class="custom-prep-unit p-2 text-[10px] border rounded bg-white font-bold flex-1">
                        ${UNIT_TYPES.map(u => `<option value="${u}" ${unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                    </select>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-red-500 px-2"><i class="fas fa-times"></i></button>
                </div>`;
            container.appendChild(div);
        }

        function handleFuzzySearch(val) {
            const resultsDiv = document.getElementById('fuzzy-results');
            if (!val || val.length < 1) {
                resultsDiv.classList.add('hidden');
                return;
            }
            const query = val.toLowerCase();
            const matches = clientsDb.filter(c =>
                (c.klienti || '').toLowerCase().includes(query) ||
                (c.nui || '').toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                resultsDiv.innerHTML = matches.map(c => `
                    <div onclick="selectFuzzyResult('${c.nui}')" class="p-4 hover:bg-green-50 cursor-pointer border-b last:border-0 border-gray-100 flex flex-col gap-1 active:bg-green-100 transition-colors">
                        <div class="font-black text-black uppercase text-sm">${c.klienti}</div>
                        <div class="text-[11px] text-gray-500 font-bold uppercase">NUI: ${c.nui} | ${c.adresa}</div>
                    </div>`).join('');
                resultsDiv.classList.remove('hidden');
            } else {
                resultsDiv.classList.add('hidden');
            }
        }

        function selectFuzzyResult(nui) {
            const c = clientsDb.find(x => x.nui === nui);
            if (c) {
                document.getElementById('f-klienti').value = c.klienti || '';
                document.getElementById('f-adresa').value = c.adresa || '';
                document.getElementById('f-nui').value = c.nui || '';
                document.getElementById('f-m2').value = c.m2 || '';
                document.getElementById('f-tel').value = c.tel || '';
                document.getElementById('f-email').value = c.email || '';
            }
            document.getElementById('fuzzy-results').classList.add('hidden');
        }

        function fillClientData(nui) {
            const c = clientsDb.find(x => x.nui === nui);
            if (c) {
                document.getElementById('f-klienti').value = c.klienti || '';
                document.getElementById('f-adresa').value = c.adresa || '';
                document.getElementById('f-nui').value = c.nui || '';
                document.getElementById('f-m2').value = c.m2 || '';
                document.getElementById('f-tel').value = c.tel || '';
                document.getElementById('f-email').value = c.email || '';
            }
        }

        function saveData() {
            const preps = Array.from(document.querySelectorAll('.prep-check:checked')).map(c => {
                const sid = c.dataset.name.replace(/\s/g, '_');
                const row = document.getElementById(`qty-row-${sid}`);
                return { emri: c.dataset.name, sasia: row.querySelector('.prep-qty').value, njesia: row.querySelector('.prep-unit').value };
            });
            document.querySelectorAll('.custom-prep-name').forEach(input => {
                const row = input.parentElement;
                if (input.value.trim()) {
                    preps.push({ emri: input.value.toUpperCase(), sasia: row.querySelector('.custom-prep-qty').value, njesia: row.querySelector('.custom-prep-unit').value });
                }
            });

            const doc = {
                id: currentId,
                data: document.getElementById('f-data').value,
                ora: document.getElementById('f-ora').value,
                nr_v: document.getElementById('f-nr-v').value,
                klienti: document.getElementById('f-klienti').value,
                adresa: document.getElementById('f-adresa').value,
                nui: document.getElementById('f-nui').value,
                m2: document.getElementById('f-m2').value,
                tel: document.getElementById('f-tel').value,
                email: document.getElementById('f-email').value,
                tekniku_emri: document.getElementById('f-tekniku-emri').value,
                shenime: document.getElementById('f-shenime').value,
                cmimi: document.getElementById('f-cmimi').value,
                sherbimet: Array.from(document.querySelectorAll('.sh-check:checked')).map(c => c.value),
                pestat: Array.from(document.querySelectorAll('.pest-check:checked')).map(c => c.value),
                metodat: Array.from(document.querySelectorAll('.metoda-check:checked')).map(c => c.value),
                preparatet: preps,
                sig_tekniku: (padTekniku && !padTekniku.isEmpty()) ? padTekniku.toDataURL('image/png') : (document.getElementById('sig-tekniku').dataset.latest || null),
                sig_klienti: (padKlienti && !padKlienti.isEmpty()) ? padKlienti.toDataURL('image/png') : (document.getElementById('sig-klienti').dataset.latest || null),
                te_dhenat_e_userit: currentUser ? (currentUser.displayName || currentUser.email) : 'Sistemi',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            const btn = document.querySelector('button[onclick="saveData()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Duke ruajtur...';
            btn.classList.add('bg-green-800'); // Stay dark green during save
            btn.disabled = true;

            firestore.collection('vertetimet').doc(String(doc.id)).set(doc).then(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-green-800');
                btn.disabled = false;

                // Share & Redirect
                sharePdf(doc).then(() => {
                    showList();
                });
            }).catch(e => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-green-800');
                btn.disabled = false;
                alert("Gabim gjatë ruajtjes: " + e.message);
            });

            // Auto-save client if new
            if (doc.nui && !clientsDb.some(c => c.nui === doc.nui)) {
                saveNewClientDirectly({ klienti: doc.klienti, adresa: doc.adresa, nui: doc.nui, m2: doc.m2, tel: doc.tel, email: doc.email });
            }
        }

        function saveNewClientDirectly(c) {
            firestore.collection('klientet').doc(c.nui).set(c);
        }

        function createNew() {
            currentId = Date.now();
            clearForm();
            const tani = new Date();
            document.getElementById('f-data').value = tani.toISOString().split('T')[0];
            document.getElementById('f-ora').value = tani.toTimeString().slice(0, 5);
            document.getElementById('f-nr-v').value = getNextCertNumber();
            document.getElementById('f-shenime').value = DEFAULT_NOTE;

            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('edit-view').classList.remove('hidden');

            const nrVInput = document.getElementById('f-nr-v');
            nrVInput.readOnly = false;
            nrVInput.className = "w-full p-3 bg-white border-2 border-green-200 rounded-xl font-bold outline-none";

            setTimeout(() => {
                initPads();
                padTekniku.clear(); padKlienti.clear();
            }, 200);
        }

        function clearForm() {
            document.querySelectorAll('input[type="text"], textarea, input[type="date"], input[type="time"]').forEach(i => i.value = "");
            document.getElementById('f-tekniku-emri').value = "";
            document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
            if (padTekniku) padTekniku.clear();
            if (padKlienti) padKlienti.clear();
            document.getElementById('custom-prep-container').innerHTML = "";
            FIXED_PREPS.forEach(p => togglePrepRow(p.replace(/\s/g, '_'), false));
        }

        function editDoc(id, silent = false) {
            const d = db.find(x => x.id === id);
            if (!d) return;
            currentId = id;
            clearForm();
            document.getElementById('f-data').value = d.data || "";
            document.getElementById('f-ora').value = d.ora || "";
            document.getElementById('f-nr-v').value = d.nr_v || "";
            document.getElementById('f-klienti').value = d.klienti || "";
            document.getElementById('f-adresa').value = d.adresa || "";
            document.getElementById('f-nui').value = d.nui || "";
            document.getElementById('f-m2').value = d.m2 || "";
            document.getElementById('f-tel').value = d.tel || "";
            document.getElementById('f-tekniku-emri').value = d.tekniku_emri || "";
            document.getElementById('f-shenime').value = d.shenime || "";
            document.getElementById('f-cmimi').value = d.cmimi || "";

            d.sherbimet?.forEach(v => { const cb = Array.from(document.querySelectorAll('.sh-check')).find(c => c.value === v); if (cb) cb.checked = true; });
            d.pestat?.forEach(v => { const cb = Array.from(document.querySelectorAll('.pest-check')).find(c => c.value === v); if (cb) cb.checked = true; });
            d.metodat?.forEach(v => { const cb = Array.from(document.querySelectorAll('.metoda-check')).find(c => c.value === v); if (cb) cb.checked = true; });

            d.preparatet?.forEach(p => {
                const cb = document.querySelector(`.prep-check[data-name="${p.emri}"]`);
                if (cb) {
                    cb.checked = true;
                    const sid = p.emri.replace(/\s/g, '_');
                    const row = document.getElementById(`qty-row-${sid}`);
                    if (row) { row.style.display = 'flex'; row.querySelector('.prep-qty').value = p.sasia; row.querySelector('.prep-unit').value = p.njesia; }
                } else { addNewPrepField(p.emri, p.sasia, p.njesia); }
            });

            if (!silent) {
                document.getElementById('list-view').classList.add('hidden');
                document.getElementById('edit-view').classList.remove('hidden');
            }

            const nrVInput = document.getElementById('f-nr-v');
            nrVInput.readOnly = false;
            nrVInput.className = "w-full p-3 bg-white border-2 border-green-200 rounded-xl font-bold outline-none";

            setTimeout(() => {
                initPads();
                if (d.sig_tekniku) padTekniku.fromDataURL(d.sig_tekniku);
                if (d.sig_klienti) padKlienti.fromDataURL(d.sig_klienti);
            }, 200);
        }

        function deleteDoc(id) {
            if (!confirm("A jeni i sigurt që dëshironi të fshini këtë vërtetim? Ky veprim nuk mund të kthehet.")) return;
            firestore.collection('vertetimet').doc(String(id)).delete()
                .then(() => alert("Vërtetimi u fshie me sukses!"))
                .catch(e => alert("Gabim gjatë fshirjes: " + e.message));
        }

        async function triggerAction(id, action) {
            const d = db.find(x => String(x.id) === String(id));
            if (!d) return;
            // Pre-load data into form fields for PDF generation
            editDoc(id, true);
            setTimeout(() => { sharePdf(d, action); }, 500);
        }

        function showDashboard() {
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view', 'login-view'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            document.getElementById('dashboard-view').classList.remove('hidden');
            updateDashboardCount();

            // RBAC UI Control
            const isAdmin = currentRole === 'admin';
            const btnManage = document.getElementById('btn-manage-clients');
            const btnUserAdd = document.getElementById('btn-user-add-client');
            const btnBack = document.getElementById('btn-client-form-back');

            if (btnManage) btnManage.style.display = isAdmin ? 'flex' : 'none';
            if (btnUserAdd) btnUserAdd.style.display = isAdmin ? 'none' : 'flex';
            if (btnBack) btnBack.onclick = isAdmin ? showClientManagement : showDashboard;
        }

        function showList() {
            showOnlyExpired = false;
            const btn = document.getElementById('btn-panic');
            btn.innerHTML = `<i class="fas fa-filter"></i> Filtro: Të gjitha`;
            btn.className = "w-full md:w-auto bg-gray-100 hover:bg-gray-200 text-gray-700 border-2 border-gray-300 px-6 py-2 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-sm text-sm";
            document.getElementById('search-input').value = '';
            renderList();
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('list-view').classList.remove('hidden');
        }

        function showPanicList() {
            showOnlyExpired = true;
            const btn = document.getElementById('btn-panic');
            btn.innerHTML = 'Trego të Gjithë';
            btn.className = "w-full md:w-auto bg-gray-800 hover:bg-gray-900 text-white border-2 border-gray-900 px-6 py-2 rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-sm text-sm";
            document.getElementById('search-input').value = '';
            renderList();
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('list-view').classList.remove('hidden');
        }

        function togglePanicFilter() {
            if (showOnlyExpired) showList(); else showPanicList();
        }

        function renderList() {
            const query = document.getElementById('search-input')?.value.toLowerCase() || '';
            let filtered = db.filter(d => (d.klienti || '').toLowerCase().includes(query) || (d.nr_v || '').toLowerCase().includes(query));
            if (showOnlyExpired) filtered = filtered.filter(d => monthsDiff(d.data) >= 6);
            document.getElementById('btn-panic').textContent = showOnlyExpired ? 'Filtro: Skaduar' : 'Filtro: Të Gjitha';

            document.getElementById('docs-list').innerHTML = filtered.map(d => `
                <tr class="border-b border-gray-100 hover:bg-green-50/40 transition-colors group">
                    <td class="p-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-[10px] font-black">${d.nr_v}</span></td>
                    <td class="p-4 font-black text-gray-800 text-xs uppercase">${d.klienti}</td>
                    <td class="p-4 font-bold text-gray-600 text-xs">${d.data.split('-').reverse().join('/')}</td>
                    <td class="p-4 font-black text-gray-900 text-xs">${d.cmimi ? d.cmimi + ' €' : '-'}</td>
                    <td class="p-4 text-gray-400 text-[10px] font-medium truncate max-w-[150px] italic">${d.te_dhenat_e_userit || 'Sistemi'}</td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-4">
                            <button onclick="triggerAction('${d.id}', 'view')" class="text-blue-500 hover:text-blue-700 transition-all hover:scale-125" title="Shiko PDF"><i class="fas fa-file-pdf"></i></button>
                            <button onclick="editDoc(${d.id})" class="text-amber-500 hover:text-amber-700 transition-all hover:scale-125" title="Edito"><i class="fas fa-pencil-alt"></i></button>

        function updateDashboardCount() {
            const count = db.filter(d => monthsDiff(d.data) >= 6).length;
            const badge = document.getElementById('dash-expired-count');
            if (badge) badge.innerText = count;
        }

        function showClientManagement() {
            if (currentRole !== 'admin') {
                showDashboard();
                return;
            }
            renderClientsTable();
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view', 'login-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('clients-mgmt-view').classList.remove('hidden');
        }

        function renderClientsTable() {
            const container = document.getElementById('clients-table-container');
            if (clientsDb.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 font-bold py-10">Nuk ka klientë.</div>';
                return;
            }
            container.innerHTML = clientsDb.map(c => `
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex justify-between items-center">
                    <div>
                        <div class="font-black text-blue-900 uppercase">${c.klienti}</div>
                        <div class="text-xs text-gray-500 font-bold">NUI: ${c.nui} | ${c.adresa}</div>
                        ${c.email ? `<div class="text-[10px] text-blue-600 font-bold uppercase mt-1">${c.email}</div>` : ''}
                    </div>
                    <div class="flex gap-2">
                        ${currentRole === 'admin' ? `
                        <button onclick="showClientForm('${c.nui}')" class="bg-amber-100 text-amber-700 px-4 py-2 rounded-lg font-bold text-xs">EDITO</button>
                        <button onclick="deleteClient('${c.nui}')" class="bg-red-100 text-red-700 px-4 py-2 rounded-lg font-bold text-xs">FSHIJ</button>

        function deleteClient(nui) {
            if (confirm("Fshij klientin?")) {
                firestore.collection('klientet').doc(nui).delete();
            }
        }

        function showClientForm(nui = null) {
            ['dashboard-view', 'list-view', 'edit-view', 'print-view', 'client-view', 'clients-mgmt-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('client-view').classList.remove('hidden');
            ['c-klienti', 'c-nui', 'c-adresa', 'c-m2', 'c-tel', 'c-email'].forEach(id => document.getElementById(id).value = '');
            editingClientNui = nui;
            if (nui) {
                const c = clientsDb.find(x => x.nui === nui);
                if (c) {
                    document.getElementById('c-klienti').value = c.klienti;
                    document.getElementById('c-nui').value = c.nui;
                    document.getElementById('c-adresa').value = c.adresa;
                    document.getElementById('c-m2').value = c.m2;
                    document.getElementById('c-tel').value = c.tel;
                    document.getElementById('c-email').value = c.email || '';
                }
            }
        }

        function handleSaveClient() {
            const btn = document.querySelector('#client-view button[onclick="handleSaveClient()"]');
            const originalHtml = btn.innerHTML;

            const c = {
                klienti: document.getElementById('c-klienti').value.trim().toUpperCase(),
                nui: document.getElementById('c-nui').value.trim().toUpperCase(),
                adresa: document.getElementById('c-adresa').value.trim().toUpperCase(),
                m2: document.getElementById('c-m2').value.trim(),
                tel: document.getElementById('c-tel').value.trim(),
                email: document.getElementById('c-email').value.trim().toLowerCase()
            };

            if (!c.klienti || !c.nui) return alert("Plotësoni emrin dhe NUI!");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Duke ruajtur...';

            firestore.collection('klientet').doc(c.nui).set(c).then(() => {
                alert("Klienti u ruajt me sukses!");
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                if (currentRole === 'admin') showClientManagement();
                else showDashboard();
            }).catch(err => {
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                alert("Gabim gjatë ruajtjes: " + err.message);
            });
        }

                                <div class="w-full border-t border-black pt-1 uppercase text-black font-black text-[12px]">TEKNIKU</div>

                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, logging: false, width: 800, backgroundColor: '#ffffff' },

        async function shareDocById(id) {
            const d = db.find(x => x.id === id);
            if (d) await sharePdf(d);
        }

        async function sharePdf(d, action = 'share') {
            const cleanNr = d.nr_v.replace(/\//g, '-').replace(/Nr\.\s+/g, '').replace(/\s+/g, '');
            const cleanClient = d.klienti.trim().replace(/\s+/g, '_').toUpperCase();
            const filename = `Vertetim_${cleanNr}_${cleanClient}.pdf`;
            const clientEmail = d.email || '';

            // Setup Temp View for generation
            previewDoc(d);
            // Wait for DOM to fully render
            await new Promise(r => setTimeout(r, 800));

            const actualPrintContainer = document.querySelector('#pdf-render-zone #pdf-container-actual');
            const opt = {
                margin: 0,
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, width: 800, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            try {
                if (action === 'view') {
                    // For viewing: use bloburl method to open in new tab
                    html2pdf().from(actualPrintContainer).set(opt).toPdf().get('pdf').then(function (pdf) {
                        window.open(pdf.output('bloburl'), '_blank');
                    });
                    return;
                }

                // For sharing: Generate PDF Blob with proper async/await
                console.log('Starting PDF generation...');
                const pdfBlob = await html2pdf().from(actualPrintContainer).set(opt).output('blob');
                console.log('PDF Blob created, size:', pdfBlob.size);

                // CRITICAL: Wait 2 seconds to ensure phone processes the graphics fully
                console.log('Waiting 2 seconds before sharing...');
                await new Promise(r => setTimeout(r, 2000));

                // Create File Object with correct filename
                const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                console.log('File Object created:', file.name, 'Size:', file.size);

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    console.log('Opening share menu...');
                    await navigator.share({
                        files: [file],
                        title: filename,
                        text: 'Vertetim per kryerjen e sherbimeve te DDD-se'
                    });
                    console.log('Share completed successfully');
                } else {
                    // Fallback: Download first, then Alert, then Mailto
                    console.log('Share API not available, falling back to download');
                    html2pdf().from(actualPrintContainer).set(opt).save();
                    alert("Vërtetimi u ruajt në telefon. Tani mund ta dërgoni.");
                    const triggerMailto = () => {
                        const subject = encodeURIComponent("Vertetim per kryerjen e sherbimeve te DDD-se");
                        const body = encodeURIComponent("I nderuar klient, bashkangjitur gjeni vërtetimin e shërbimit DDD nga Ekologjia DDD.");
                        window.location.href = `mailto:${clientEmail}?subject=${subject}&body=${body}`;
                    };
                    setTimeout(triggerMailto, 1000);
                }
            } catch (err) {
                console.error("Share error:", err);
                alert("Gabim gjatë procesimit: " + err.message);
            }
        }


        window.onload = () => {
            buildForms();
            initPads();
            initRealtimeListeners();
            // Attach Login Listener
            document.getElementById('login-btn').onclick = doLogin;

            // Auth Listener
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) {
                    currentUser = null;
                    currentRole = "user";
                    showLogin();
                    return;
                }
                currentUser = user;

                // Load role from Firestore:
                const snap = await firestore.collection('users').doc(user.uid).get();
                currentRole = (snap.exists && snap.data().role) ? snap.data().role : "user";

                // Then show dashboard:
                showDashboard();
            });
        };

    </script>
